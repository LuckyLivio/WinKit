name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify-windows:
    name: Frontend & Rust Checks (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Rust stable (MSVC x64)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend formatting
        run: npm run format:check

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run frontend unit tests
        run: npm test

      - name: Build frontend assets
        run: npm run build

      - name: Ensure verified I02 YuNet ONNX model
        run: npm run ensure-face-model

      - name: Ensure verified Windows x64 PDFium runtime
        run: npm run ensure-pdfium

      - name: Ensure verified Windows x64 QPDF runtime
        run: npm run ensure-qpdf

      - name: Ensure verified Windows x64 OCR runtime & RapidOCR PP-OCRv4 models
        run: npm run ensure-ocr-runtime

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run Cargo Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust unit & integration tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Verify Windows image clipboard pixel round trip
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib qr::tests::windows_clipboard_roundtrip -- --exact --ignored

      - name: Build Rust Tauri binary
        run: cargo build --manifest-path src-tauri/Cargo.toml

  windows-installer:
    name: Build and verify Windows x64 NSIS installer
    needs: verify-windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - run: npm ci

      - name: Build release-mode NSIS installer from the tested commit
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -cne $env:GITHUB_SHA) { throw "Unexpected checkout" }
          npm run tauri -- build --ci --target x86_64-pc-windows-msvc --bundles nsis -- --locked

      - name: Verify installation and record artifact details
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $filename = "WinKit_${version}_x64-setup.exe"
          $installer = Get-Item "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/$filename"
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          $signature = (Get-AuthenticodeSignature -FilePath $installer.FullName).Status.ToString()
          if ($signature -notin 'Valid', 'NotSigned') { throw "Authenticode status: $signature" }

          $setup = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -PassThru
          if (!$setup.WaitForExit(180000)) { throw "Silent installation timed out" }
          if ($setup.ExitCode -ne 0) { throw "NSIS returned $($setup.ExitCode)" }
          $program = Get-Item "$env:LOCALAPPDATA/WinKit/winkit.exe"
          if ($program.VersionInfo.ProductVersion -ne $version) {
            throw "Installed binary version $($program.VersionInfo.ProductVersion) differs from $version"
          }
          $bundledModel = Get-Item "$env:LOCALAPPDATA/WinKit/models/face_detection_yunet_2023mar.onnx"
          $modelHash = (Get-FileHash -Algorithm SHA256 $bundledModel.FullName).Hash.ToLowerInvariant()
          if ($bundledModel.Length -ne 232589 -or $modelHash -ne '8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4') {
            throw "Bundled I02 model mismatch: $($bundledModel.Length) B / $modelHash"
          }
          $bundledPdfium = Get-Item "$env:LOCALAPPDATA/WinKit/pdfium/pdfium.dll"
          $pdfiumHash = (Get-FileHash -Algorithm SHA256 $bundledPdfium.FullName).Hash.ToLowerInvariant()
          if ($bundledPdfium.Length -ne 7849984 -or $pdfiumHash -ne 'b9324fe77556753e24443b8ff1d03b39a3aa01ccd6e56e7debb82922438e8965') {
            throw "Bundled PDFium DLL mismatch: $($bundledPdfium.Length) B / $pdfiumHash"
          }
          $pdfiumNotice = Get-Item "$env:LOCALAPPDATA/WinKit/licenses/pdfium-notices.txt"
          if ($pdfiumNotice.Length -lt 1024) {
            throw "Bundled PDFium license notices file is missing or unexpectedly small: $($pdfiumNotice.Length) B"
          }
          $bundledQpdf = Get-Item "$env:LOCALAPPDATA/WinKit/qpdf/qpdf30.dll"
          $qpdfHash = (Get-FileHash -Algorithm SHA256 $bundledQpdf.FullName).Hash.ToLowerInvariant()
          if ($bundledQpdf.Length -ne 7448064 -or $qpdfHash -ne '8812952678de93e0750308a113aa650e9161af466f9770679ea9673adeb61041') {
            throw "Bundled QPDF DLL mismatch: $($bundledQpdf.Length) B / $qpdfHash"
          }
          $qpdfNotice = Get-Item "$env:LOCALAPPDATA/WinKit/licenses/qpdf-notices.txt"
          if ($qpdfNotice.Length -lt 1024) {
            throw "Bundled QPDF license notices file is missing or unexpectedly small: $($qpdfNotice.Length) B"
          }
          $bundledOrt = Get-Item "$env:LOCALAPPDATA/WinKit/ocr/onnxruntime.dll"
          $ortHash = (Get-FileHash -Algorithm SHA256 $bundledOrt.FullName).Hash.ToLowerInvariant()
          if ($bundledOrt.Length -ne 15709728 -or $ortHash -ne '462ea8e85b881b26388c595f96b1b9b39e57565aa4725fe29136695c1ead179f') {
            throw "Bundled ONNX Runtime DLL mismatch: $($bundledOrt.Length) B / $ortHash"
          }
          $ocrDet = Get-Item "$env:LOCALAPPDATA/WinKit/ocr/ch_PP-OCRv4_det_mobile.onnx"
          $ocrDetHash = (Get-FileHash -Algorithm SHA256 $ocrDet.FullName).Hash.ToLowerInvariant()
          if ($ocrDet.Length -ne 4745517 -or $ocrDetHash -ne 'd2a7720d45a54257208b1e13e36a8479894cb74155a5efe29462512d42f49da9') {
            throw "Bundled OCR det model mismatch: $($ocrDet.Length) B / $ocrDetHash"
          }
          $ocrCls = Get-Item "$env:LOCALAPPDATA/WinKit/ocr/ch_ppocr_mobile_v2.0_cls_mobile.onnx"
          $ocrClsHash = (Get-FileHash -Algorithm SHA256 $ocrCls.FullName).Hash.ToLowerInvariant()
          if ($ocrCls.Length -ne 581639 -or $ocrClsHash -ne '70581b300b83babd9e0dd1d7d74c5b006869e8796da277a70c2e405bf9d77c82') {
            throw "Bundled OCR cls model mismatch: $($ocrCls.Length) B / $ocrClsHash"
          }
          $ocrRec = Get-Item "$env:LOCALAPPDATA/WinKit/ocr/ch_PP-OCRv4_rec_mobile.onnx"
          $ocrRecHash = (Get-FileHash -Algorithm SHA256 $ocrRec.FullName).Hash.ToLowerInvariant()
          if ($ocrRec.Length -ne 10857958 -or $ocrRecHash -ne '48fc40f24f6d2a207a2b1091d3437eb3cc3eb6b676dc3ef9c37384005483683b') {
            throw "Bundled OCR rec model mismatch: $($ocrRec.Length) B / $ocrRecHash"
          }
          $ocrNotice = Get-Item "$env:LOCALAPPDATA/WinKit/licenses/ocr-notices.txt"
          if ($ocrNotice.Length -lt 1024) {
            throw "Bundled OCR license notices file is missing or unexpectedly small: $($ocrNotice.Length) B"
          }

          $desktopCheck = 'No interactive main window on runner'
          $app = Start-Process -FilePath $program.FullName -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(30)
            do {
              Start-Sleep -Milliseconds 250
              $app.Refresh()
              if ($app.HasExited) { throw "Application exited during startup: $($app.ExitCode)" }
            } while ($app.MainWindowHandle -eq [IntPtr]::Zero -and [DateTime]::UtcNow -lt $deadline)
            if ($app.MainWindowHandle -ne [IntPtr]::Zero) {
              if (!$app.CloseMainWindow() -or !$app.WaitForExit(15000) -or $app.ExitCode -ne 0) {
                throw "Application did not close normally"
              }
              $desktopCheck = 'Main window opened and closed with exit code 0'
            }
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id }
          }

          $out = New-Item -Type Directory -Path release-artifact
          Copy-Item -LiteralPath $installer.FullName -Destination $out.FullName
          Set-Content "$out/SHA256SUMS.txt" "$hash  $filename" -Encoding ascii
          [ordered]@{
            commit = $env:GITHUB_SHA
            filename = $filename
            bytes = $installer.Length
            sha256 = $hash
            authenticode = $signature
            installedVersion = $program.VersionInfo.ProductVersion
            desktopCheck = $desktopCheck
          } | ConvertTo-Json | Set-Content "$out/artifact.json" -Encoding utf8NoBOM
          Get-Content "$out/artifact.json"

      - name: Upload verified installer and checksums
        uses: actions/upload-artifact@v4
        with:
          name: WinKit-windows-x64-${{ github.sha }}
          path: release-artifact/
          if-no-files-found: error
          compression-level: 0
