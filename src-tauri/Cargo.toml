[package]
name = "winkit"
version = "0.9.0"
description = "WinKit local-first Windows desktop utility workbench"
authors = ["Livio <liviow@163.com>"]
edition = "2021"
rust-version = "1.93"

[lib]
name = "winkit_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3"
base64 = "0.22"
bzip2-rs = "0.1"
flate2 = "1"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz"] }
md-5 = "0.10"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sevenz-rust2 = { version = "0.25", default-features = false, features = ["aes256", "deflate", "ppmd", "util"] }
sha1 = "0.10"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
unicode-general-category = "1"
unicode-script = "0.5"
unicode-security = "0.1"
unicode-segmentation = "1"
unicode_names2 = "1"
unrar-rs = { version = "0.16", default-features = false, features = ["crypto-rust"] }
uuid = { version = "1", features = ["v4", "v7"] }
zip = { version = "9", default-features = false, features = ["aes-crypto", "deflate-flate2", "lzma", "xz", "time"] }

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_UI_Shell",
] }
windows-core = "0.62"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[profile.dev.package.image]
opt-level = 2

[profile.dev.package.flate2]
opt-level = 2

[profile.dev.package.miniz_oxide]
opt-level = 2

[profile.dev.package.zune-jpeg]
opt-level = 2

[profile.dev.package.png]
opt-level = 2
