[package]
name = "winkit"
version = "0.16.0"
description = "WinKit local-first Windows desktop utility workbench"
authors = ["Livio <liviow@163.com>"]
edition = "2021"
rust-version = "1.93"

[lib]
name = "winkit_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3"
base64 = "0.22"
bzip2-rs = "0.1"
exoquant = "0.2"
flate2 = "1"
gif = "0.14"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp", "tiff", "gif"] }
jpeg-encoder = "0.7"
kamadak-exif = "0.6"
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz"] }
md-5 = "0.10"
oxipng = { version = "10", default-features = false, features = ["parallel"] }
png = "0.18"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sevenz-rust2 = { version = "0.25", default-features = false, features = ["aes256", "deflate", "ppmd", "util"] }
sha1 = "0.10"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
tiff = "0.11"
tract-onnx = { version = "0.23.10", default-features = false }
unicode-general-category = "1"
unicode-script = "0.5"
unicode-security = "0.1"
unicode-segmentation = "1"
unicode_names2 = "1"
unrar-rs = { version = "0.16", default-features = false, features = ["crypto-rust"] }
uuid = { version = "1", features = ["v4", "v7"] }
webp = { version = "0.3", default-features = false }
zip = { version = "9", default-features = false, features = ["aes-crypto", "deflate-flate2", "lzma", "xz", "time"] }

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"
windows = { version = "0.62", features = [
  "Foundation",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Media_Audio",
  "Win32_Media_KernelStreaming",
  "Win32_Media_Multimedia",
  "Win32_Networking_WinHttp",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[profile.dev.package.image]
opt-level = 2

[profile.dev.package.flate2]
opt-level = 2

[profile.dev.package.miniz_oxide]
opt-level = 2

[profile.dev.package.zune-jpeg]
opt-level = 2

[profile.dev.package.png]
opt-level = 2

[profile.dev.package.tract-linalg]
opt-level = 2

[profile.dev.package.tract-core]
opt-level = 2

[profile.dev.package.tract-hir]
opt-level = 2

[profile.dev.package.tract-onnx]
opt-level = 2

[profile.dev.package.sevenz-rust2]
opt-level = 2

[profile.dev.package.lzma-rust2]
opt-level = 2
